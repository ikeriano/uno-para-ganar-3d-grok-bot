<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Uno para ganar 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#03040b;font-family:"Arial Black",Arial,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cj{z-index:2}#capa{z-index:3;pointer-events:none}
.hide{display:none!important}
#hud{position:fixed;inset:0;z-index:4;pointer-events:none}
#vidas{position:absolute;left:12px;top:10px;font-size:24px;text-shadow:0 2px 4px #000}
#nombreH{position:absolute;left:12px;top:44px;font:bold 15px Arial;color:#cfe3ff;text-shadow:0 1px 3px #000}
#banco{position:absolute;left:12px;top:66px;font-size:18px;color:#ffd23a;text-shadow:0 2px 4px #000}
#esc{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:3px}
#esc div{font:bold 13px Arial;padding:3px 10px;border-radius:12px;background:rgba(5,15,60,.75);border:2px solid #1d58d8;min-width:110px;text-align:right}
#esc div.seg{border-color:#ff7a1a}#esc div.ok{background:#1d58d8}#esc div.act{background:#ffd23a;color:#102;border-color:#fff;transform:scale(1.08)}
#relojH{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:radial-gradient(#0b2a8a,#061a5a);border:5px solid #e8262d;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 18px #3a7bff}
#relojH.poco{border-color:#ffd23a;color:#ffd23a}
#progH{position:absolute;left:50%;top:100px;transform:translateX(-50%);font:bold 18px Arial;background:rgba(0,0,0,.5);padding:3px 14px;border-radius:14px;white-space:nowrap}
#mosca{position:fixed;right:10px;bottom:8px;width:72px;opacity:.85;z-index:9;pointer-events:none}
#bub{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:78%;background:rgba(4,12,48,.92);border:2px solid #3a7bff;border-radius:16px;padding:8px 16px;z-index:12;font:bold 18px Arial;line-height:1.3;pointer-events:auto}
#bub b{color:#ffd23a;font-size:14px;display:block}
#titulo{position:fixed;left:0;right:0;bottom:84px;margin:auto;width:max-content;max-width:90%;background:linear-gradient(90deg,#0b2a8a,#1d58d8);padding:8px 22px;font-size:18px;z-index:10;border-left:6px solid #ff7a1a;animation:ent .4s}
@keyframes ent{from{transform:translateX(-60px);opacity:0}}
#cartel{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:54px;z-index:11;text-shadow:0 4px 0 #0b2a8a,0 0 24px #3a7bff;pointer-events:none;animation:pop .5s}
#cartel small{display:block;font-size:22px;color:#ffd23a}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#btns{position:fixed;left:0;right:0;bottom:90px;display:flex;justify-content:center;gap:12px;z-index:13;flex-wrap:wrap;padding:0 90px}
button,.b{font:bold 17px Arial;color:#fff;background:linear-gradient(#2a6cff,#0b2a8a);border:2px solid #9fc4ff;border-radius:14px;padding:10px 18px;box-shadow:0 3px 0 #061a5a}
button:active{transform:translateY(2px)}button.gold{background:linear-gradient(#ffb238,#e86a00);border-color:#ffe2a0}button.rojo{background:linear-gradient(#ff5a5a,#b01818)}
#menu,#panel{position:fixed;inset:0;z-index:20;overflow-y:auto;padding:14px 18px 30px;background:linear-gradient(rgba(3,6,25,.55),rgba(3,6,25,.85))}
#menu h1{margin:4px 0 0;text-align:center;font-size:34px;color:#fff;text-shadow:0 3px 0 #e8262d,0 0 20px #3a7bff}
#menu h1 span{color:#ffd23a}.sub{text-align:center;font:bold 14px Arial;color:#9fc4ff;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-width:980px;margin:0 auto}
.grid button{text-align:left;padding:10px 12px;font-size:16px}.grid button small{display:block;font:12px Arial;color:#cfe3ff;margin-top:3px}
#panel h2{text-align:center;margin:4px 0 12px;font-size:26px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:6px auto;background:rgba(10,30,100,.6);padding:8px 12px;border-radius:12px;font:bold 16px Arial}
.fila .op button{padding:6px 12px;font-size:14px;margin-left:4px;background:#223}.fila .op button.on{background:linear-gradient(#2ecc71,#178a45)}
.nuevo{font:bold 11px Arial;background:#ff7a1a;color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px}
.volver{position:fixed;left:10px;top:10px;z-index:30;padding:6px 12px;font-size:15px}
#hist{position:fixed;inset:0;z-index:14;pointer-events:none}
#hCard{pointer-events:auto;position:absolute;left:3%;top:6%;width:44%;max-height:66%;overflow:auto;background:rgba(4,12,48,.9);border:2px solid #3a7bff;border-radius:18px;padding:12px 16px;font:bold 15px Arial}
#hCard h3{margin:0 0 8px;font:900 22px "Arial Black",Arial;color:#ffd23a}
#hCard .r{display:flex;gap:8px;margin:5px 0}#hCard .r b{color:#9fc4ff;min-width:38%}
.chip{display:inline-block;background:#1d58d8;border-radius:12px;padding:4px 10px;margin:3px}.tile{display:inline-block;width:46%;margin:1%;background:rgba(29,88,216,.5);border-radius:10px;padding:6px;text-align:center}
.stat{display:inline-block;width:46%;margin:1%;text-align:center}.stat b{display:block;font-size:30px;color:#ffd23a}
#hCtl{pointer-events:auto;position:absolute;right:3%;top:6%;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#hDots{display:flex;gap:5px}#hDots i{width:11px;height:11px;border-radius:50%;background:#334}#hDots i.on{background:#ffd23a}
#joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);z-index:15}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#inv{position:fixed;left:10px;bottom:10px;z-index:12;font:bold 12px Arial;background:#ff7a1a;padding:3px 8px;border-radius:8px}
#plano{position:fixed;inset:7% 12%;z-index:12;background:#0b3a9a url() center/cover;border:4px solid #fff;border-radius:10px;padding:16px 24px;font:bold 20px Arial;
 background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:26px 26px;background-color:#0b3a9a}
#plano h2{margin:0 0 6px;font:900 30px "Arial Black";color:#ffd23a}#plano img{float:right;max-height:55%;max-width:34%;margin-left:12px}#plano li{margin:6px 0}
#fade{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .4s}
input{font:bold 20px Arial;padding:8px;border-radius:10px;border:2px solid #3a7bff;width:220px}
.cred{max-width:640px;margin:0 auto;text-align:center;font:16px Arial}.cred b{color:#ffd23a}
</style></head><body>
<canvas id="c3d"></canvas><canvas id="cj" class="hide"></canvas><canvas id="capa" class="hide"></canvas>
<div id="hud" class="hide"><div id="vidas"></div><div id="nombreH"></div><div id="banco"></div><div id="esc"></div><div id="relojH" class="hide">60</div><div id="progH" class="hide"></div></div>
<img id="mosca" src="img/showtime.png" alt="">
<div id="bub" class="hide"><b></b><span></span></div>
<div id="titulo" class="hide"></div><div id="cartel" class="hide"></div><div id="btns"></div>
<div id="plano" class="hide"></div>
<div id="hist" class="hide"><div id="hCard"></div><div id="hCtl"><div id="hDots"></div><div style="display:flex;gap:6px"><button id="hPrev">◀ Anterior</button><button id="hSkip">⏭ Saltar</button><button id="hNext" class="gold">Siguiente ▶</button></div></div></div>
<div id="joy" class="hide"><i></i></div><div id="inv" class="hide">🆕 INVENTADO</div>
<div id="menu" class="hide"></div><div id="panel" class="hide"></div><div id="fade"></div>
<script src="js/data.js"></script><script src="js/studio.js"></script><script src="js/studio-lights.js"></script><script src="aps/antenaps.js"></script>
<script type="module" src="js/main.js"></script>
</body></html>
